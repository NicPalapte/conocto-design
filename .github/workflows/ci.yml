# Prüft bei jedem PR und auf main: passen CSS-Variablen und JSON zusammen,
# lassen sich die Bausteine bauen und fehlerfrei anzeigen.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:tokens
      - run: npm test
