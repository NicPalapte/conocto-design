# Prüft bei jedem PR und auf main: passen CSS-Variablen und JSON zusammen,
# lassen sich die Bausteine bauen und fehlerfrei anzeigen.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Ganze Historie: die Prüfung unten vergleicht den PR mit main.
          fetch-depth: 0
      # Meldet, was nach dem Merge Konflikte erzeugt (Nummer, Tabellenzeile, Version von Hand).
      # Siehe docs/decisions/0001-nummern-beim-merge.md.
      - name: Entscheidungen, Version, Changelog
        if: github.event_name == 'pull_request'
        run: |
          python3 -m unittest discover -s .github/conocto -q
          python3 .github/conocto/entscheidungen.py pruefen --praefix DS \
            --versionsdatei package.json --lockdatei package-lock.json \
            --basis "origin/${{ github.base_ref }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:tokens
      - run: npm test
